[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autometa"
version = "0.1.0"
description = "Researcher-supervised evidence synthesis workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "beautifulsoup4>=4.11",
  "docling>=2.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "lxml>=4.9",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "openai>=1.0",
  "pandas>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "rank-bm25>=0.2.2",
  "requests>=2.31",
  "scipy>=1.12",
  "sqlalchemy>=2.0,<3",
  "tenacity>=8.2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[project.scripts]
autometa = "autometa.cli:main"

[tool.setuptools.packages.find]
include = ["autometa*"]

[tool.setuptools.package-data]
autometa = ["static/**/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"] # P, I, C, and O are the domain-standard PICO field names.
