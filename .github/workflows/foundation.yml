name: foundation

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test frontend
        run: npm test -- --run
        working-directory: frontend
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Verify committed frontend build
        run: git diff --exit-code -- autometa/static

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install AutoMeta
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest tests -q
      - name: Lint Python source
        run: python -m ruff check .
      - name: Verify application import
        run: python -c "from autometa.api.main import app; assert app.title == 'AutoMeta'"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel install and CLI
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]]); subprocess.check_call([sys.executable, '-m', 'autometa', '--help'])"

  docker:
    name: Docker / Linux CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build --tag autometa:test .
      - name: Start container
        run: docker run --detach --name autometa-test --publish 127.0.0.1:8016:8016 autometa:test
      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8016/api/v1/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs autometa-test
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force autometa-test
